<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Авто рассчет км для курьеров</title>
  <meta name="description" content="Упрощение для админов составление маршруты и рассчет км" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    html { font-family: system-ui, -apple-system, sans-serif; }
    #root { min-height: 100vh; }
    #splash {
      position: fixed; inset: 0;
      background: #0a0f1e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 40px rgba(37,99,235,0.4);
      animation: pulse 2s ease-in-out infinite;
      margin-bottom: 24px;
    }
    .splash-title {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .splash-sub {
      color: #4b5563;
      font-size: 13px;
      margin-bottom: 36px;
    }
    .splash-bar {
      width: 160px; height: 3px;
      background: #1e2740;
      border-radius: 99px;
      overflow: hidden;
    }
    .splash-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 99px;
      animation: load 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 30px rgba(37,99,235,0.4); }
      50% { box-shadow: 0 0 60px rgba(124,58,237,0.6); }
    }
    @keyframes load {
      0% { width: 0%; margin-left: 0%; }
      50% { width: 80%; margin-left: 10%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
  <script>
    window.addEventListener('error', (e) => {
      const isModuleError =
        e.message?.toLowerCase().includes('importing a module script failed') ||
        e.message?.toLowerCase().includes('chunkloaderror') ||
        (e.target && e.target.tagName === 'SCRIPT' && e.target.src && e.target.src.includes('/assets/'));
      if (isModuleError) {
        const lastReload = sessionStorage.getItem('last_module_reload');
        const now = Date.now();
        if (!lastReload || (now - parseInt(lastReload)) > 10000) {
          sessionStorage.setItem('last_module_reload', now.toString());
          window.location.reload();
        }
      }
    }, true);
  </script>
</head>

<body>
  <div id="splash">
    <div class="splash-logo">🚀</div>
    <div class="splash-title">Kill-Metraj</div>
    <div class="splash-sub">Загрузка системы...</div>
    <div class="splash-bar"><div class="splash-fill"></div></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
